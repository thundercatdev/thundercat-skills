name: Engram Skills CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: engram-skills-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate manifest and packages
        run: python scripts/validate.py
